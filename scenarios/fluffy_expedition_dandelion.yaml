activity_name: The Fluffy Things Expedition
entity: dandelion
tier: T1
age_range: 4-6
scene: Child is at the park and photographs a dandelion seed head in the grass
visual_features:
- white fluffy seeds
- round shape
- thin stem
- seeds ready to blow
category: Category 5 — Collection/Tracking Exploration (Out-of-Device)
key_concepts:
- Form
- Change
related_concepts:
- Pattern
- Texture
- Diversity
- Transformation
activity_steps_summary: 'Step 1 (Transition): React to the dandelion''s fluffy seed head with wonder. Ask what the fluffiness
  reminds the child of — clouds? Cotton candy? Frame the texture as a magical visual feature.

  Step 2 (Mission Briefing): Assign child as "Fluffy Things Explorer." Mission: find 3 more fluffy, soft, or fuzzy things
  in the park. Photograph each.

  Step 3 (Exploration, 3 rounds): Child photographs finds (e.g., moss, caterpillar, fuzzy leaf, cotton-like clouds). AI reacts,
  asks about texture, names each find.

  Step 4 (Synthesis): Collection complete. Ask: some fluffy things were alive, some not. Why are some things fluffy? What''s
  fluffiness FOR?

  Step 5 (Closing): Celebrate. Name Form (noticing the fluffy texture pattern) and Change (dandelion changes from flower to
  seed puff — transformation).

  '
detailed_interaction_script: 'STEP 1 — TRANSITION BRIDGE

  React with wonder: "Look at this! It''s SO fluffy, like a tiny cloud on a stick!" Ask imaginative: "What does this fluffiness
  remind YOU of?" NEVER ask "what type of plant is this" or "do you know what a dandelion is."

  - Ideal (e.g. "A tiny cloud!"): Validate with delight, bridge: "I wonder if there are MORE fluffy things hiding in this
  park..."

  - Unexpected (e.g. "Can I blow it?"): Validate ("Blowing it IS the best part!"), then redirect: "Before you blow it — let''s
  see if it has any fluffy friends nearby!"

  - Silent: Wait 2 seconds, touch the fluffiness verbally: "It feels like it would be sooo soft... I have an idea for an adventure!"


  STEP 2 — MISSION BRIEFING

  Role: "Fluffy Things Explorer." Mission: find 3 more fluffy, soft, or fuzzy things. Photograph each. Give SPECIFIC examples
  of where to look: "Feel the moss on that tree, look at fuzzy caterpillars, even look UP at the clouds!"


  STEP 3 — MULTI-ROUND (3 rounds)

  Per find: react excited, ask "What does it feel like?", name it, track progress.

  If stuck: "Try touching the grass really gently — is it soft? Look at tree bark — any fuzzy patches?"

  If child''s find isn''t obviously fluffy: stretch it — "It''s a different KIND of soft! Smooth-soft instead of fluffy-soft.
  That totally counts!"


  STEP 4 — SYNTHESIS

  Display collection. Ask: "Some fluffy things are alive, some aren''t. Why do you think so many things are fluffy?" Accept
  any answer warmly, extend: "Fluffiness keeps dandelion seeds flying, keeps caterpillars warm, keeps clouds floating!"


  STEP 5 — CLOSING

  Celebrate first: "What an amazing expedition, Explorer!" Then: "You noticed the beautiful Form of softness everywhere —
  and you discovered that things Change, just like this dandelion changed from a yellow flower into a fluffy wish-maker!"

  '
