activity_name: Mood Changer
entity: stuffed dog
tier: T0
age_range: 3-4
scene: Child is in the bedroom and photographs their stuffed toy dog on the bed
visual_features:
- fluffy
- brown
- soft
- toy
- plush
- cute eyes
category: Category 1 — Sustained Verbal Interaction (In-Device)
key_concepts:
- Perspective
related_concepts:
- Emotion
- Expression
- Role
activity_steps_summary: 'Step 1 (Transition): React to the stuffed dog with delight. Ask how the dog is feeling today — emotional
  question, not factual. Frame as magical: "What if we could hear its thoughts?"

  Step 2 (Rule Intro + Demo): Explain the game through demonstration: AI describes a scenario, child voices what the dog would
  say or feel. AI models first: "If the dog lost its ball, it might say ''oh no!''"

  Step 3 (Multi-round, 3-5 rounds): Each round = new scenario targeting a different emotion. Round 1: happy/cozy. Round 2:
  surprised/startled. Round 3: excited/eager. Escalate emotional complexity.

  Step 4 (Celebration): Give the child a role title: "Emotion Translator" or similar. Celebrate their ability to understand
  feelings.

  Step 5 (Closing): Name Perspective — "The same dog feels different things when different things happen. That''s Perspective!"

  '
detailed_interaction_script: 'STEP 1 — TRANSITION BRIDGE

  React with warm delight: "Oh wow, it''s your fluffy dog friend!" Ask an EMOTIONAL question: "How is your doggy feeling today
  — happy and smiley, or maybe a little sleepy?" NEVER ask factual questions like "what color is it?"

  - If child says an emotion: Validate, then propose the magic game: "What if we could hear what it''s thinking inside?"

  - If child says something unexpected: Play along, connect to feelings, then propose the game.

  - If silent: Wait 2 seconds, guess the dog is being quiet, invite the child to be its "voice."


  STEP 2 — RULE INTRO + DEMO

  Explain by DEMONSTRATING, not explaining rules: "I''ll say something that happens to the doggy, and you tell me what it
  would say or feel! Like this — if the doggy lost its favorite ball, it might go ''ohh no, my ball!''" Then: "Your turn!
  Ready?"


  STEP 3 — MULTI-ROUND (3-5 rounds, escalating emotions)

  Round 1 (happy/cozy): "Morning! The sun is warm on the doggy''s belly. What does it say?" → Target: comfort, relaxation.

  Round 2 (surprised): "Oops! The doggy slipped and fell — bump! What does it say?" → Target: surprise, mild shock.

  Round 3 (excited): "The owner brings its favorite treat! What does the doggy do?" → Target: excitement, eagerness.

  For unexpected responses like "woof woof!": Validate AS emotional ("That''s saying hello to the sun!") then extend with
  richer example.

  For silence: Offer two choices: "Maybe it says ''so warm!'' or just goes ''hmmm''... which one?"


  STEP 4 — CELEBRATION

  Award role title: "Dog''s Emotion Translator" or "Heart Voice Champion." Celebrate specifically what the child did: "You
  heard it being happy, surprised, and excited!"


  STEP 5 — CLOSING + IB CONCEPTS

  Celebrate FIRST, then: "The same doggy feels different things when different things happen — that''s the magic of Perspective!
  Everyone sees the world a little differently."

  '
