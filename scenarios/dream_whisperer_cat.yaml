activity_name: Dream Whisperer
entity: stuffed cat
tier: T0
age_range: 3-4
scene: Child is in the bedroom and photographs their stuffed cat on the bed
visual_features:
- fluffy
- gray and white
- soft
- big eyes
- sitting
category: Category 1 — Sustained Verbal Interaction (In-Device)
key_concepts:
- Perspective
- Connection
related_concepts:
- Emotion
- Expression
- Imagination
- Identity
activity_steps_summary: 'Step 1 (Transition): React to the stuffed cat with warmth. Ask an imaginative question about what
  the cat might be dreaming about. Emotional hook, NOT knowledge testing.

  Step 2 (Rule + Demo): Introduce the game: "I''ll describe a place, and you tell me what your cat dreams about there." AI
  demonstrates first.

  Step 3 (Multi-round, 3-4 rounds): Each round presents a dream scenario (beach, clouds, kitchen, rain). Child describes what
  the cat dreams about. Rounds escalate from concrete to imaginative.

  Step 4 (Celebration): Name the child as "Dream Whisperer" — someone who understands what their cat feels.

  Step 5 (Closing): Celebrate and name Perspective (same cat, different dreams) and Connection (child understands their toy''s
  feelings).

  '
detailed_interaction_script: 'STEP 1 — TRANSITION BRIDGE

  React softly: "Aww, your kitty looks SO cozy and sleepy!" Ask imaginative question: "I wonder what it''s dreaming about
  right now..." NEVER ask "what color" or "what type of cat."

  - Ideal: Validate the child''s guess, propose the dream-peeking game.

  - Unexpected (e.g. "I have a real cat too!"): Validate warmly, redirect: "I bet your real cat dreams too! Let''s see what
  THIS one dreams about..."

  - Silent: Whisper gently, suggest: "Maybe it''s dreaming about something soft and warm..."


  STEP 2 — RULE INTRO + DEMO

  Demonstrate: "I''ll describe a dream place, and you tell me what the cat does there! Like this — Dream 1: a room full of
  yarn balls! The cat might say ''so many toys to chase!''" Then invite child.


  STEP 3 — MULTI-ROUND (3-4 rounds, escalating imagination)

  Round 1 (cozy): "Dream: a giant soft blanket that never ends..." → safe, warm.

  Round 2 (adventure): "Dream: the cat can FLY over the rooftops!" → exciting.

  Round 3 (silly): "Dream: it''s raining FISH from the sky!" → funny, absurd.

  For "meow meow" responses: Validate as dream-talk, extend with: "In cat language that means..."


  STEP 4 — CELEBRATION

  Award "Dream Whisperer" title. Celebrate: "You understood 3 completely different dreams!"


  STEP 5 — CLOSING

  Celebrate first, then: "The same sleeping cat had such different dreams — that''s Perspective! And you felt what it felt
  — that''s Connection!"

  '
