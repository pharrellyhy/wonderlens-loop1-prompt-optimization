activity_name: Dino Time Machine
entity: toy dinosaur
tier: T0
age_range: 3-4
scene: Child is in the playroom and photographs a toy T-Rex on the floor
visual_features:
- green
- big teeth
- small arms
- long tail
- plastic toy
category: Category 1 — Sustained Verbal Interaction (In-Device)
key_concepts:
- Form
- Causation
related_concepts:
- Structure
- Adaptation
- Discovery
- Imagination
activity_steps_summary: 'Step 1 (Transition): React to the dinosaur with awe. Ask something imaginative about what the dinosaur
  might have been doing / where it was going. Emotional hook.

  Step 2 (Rule + Demo): "Let''s pretend we have a time machine! I''ll take us to a place, and you tell me what your dinosaur
  sees there." AI demos: "If we went to a jungle... your dino might see giant ferns!"

  Step 3 (Multi-round, 3-4 rounds): Each round visits a different "time/place" (jungle, volcano, river, snowy mountain). Child
  describes what the dinosaur sees/does. Escalate from simple to imaginative.

  Step 4 (Celebration): Name the child as "Time Traveler" who showed their dinosaur amazing places.

  Step 5 (Closing): Celebrate and name Form (dinosaur''s body features) and Causation (why dinosaurs had big teeth, small
  arms — everything has a reason).

  '
detailed_interaction_script: 'STEP 1 — TRANSITION BRIDGE

  React with awe: "WHOA — a dinosaur! Look at those big teeth and that powerful tail!" Ask imaginative: "If this dinosaur
  could go ANYWHERE, where would it want to go?" NEVER ask "what type of dinosaur" or "how many teeth."

  - Ideal: Validate with excitement, bridge: "What if we had a TIME MACHINE and could take it there?"

  - Unexpected (e.g. "It''s just a toy"): Validate gently ("It IS a toy right now..."), redirect: "But what if we used our
  imagination to make it REAL for 5 minutes?"

  - Silent: Wait 2 seconds, build excitement: "I think this dinosaur looks like it wants an ADVENTURE. Want to take it on
  one?"


  STEP 2 — RULE INTRO + DEMO

  Demonstrate: "I''ll take us to a place in my time machine, and YOU tell me what your dinosaur sees, hears, or does there!
  Like this — we land in a steamy JUNGLE, and the dino sees... giant ferns taller than houses!" Invite child.


  STEP 3 — MULTI-ROUND (3-4 rounds, escalating sensory richness)

  Round 1 (jungle — sight): "Time machine landing: a HOT, steamy jungle! What does your dinosaur see?" → Visual descriptions.

  Round 2 (volcano — sound/feeling): "Next stop: a rumbling VOLCANO! What does the dinosaur hear and feel?" → Sounds, temperature.

  Round 3 (snowy mountain — contrast): "Brrr! A freezing snowy mountaintop! What does a dinosaur do in the COLD?" → Problem-solving,
  contrast with warm jungle.

  For minimal responses: Scaffold with choices: "Does it see trees or rocks? Is it loud or quiet?"


  STEP 4 — CELEBRATION

  Award "Dino Time Traveler" title: "You took your dinosaur to 3 amazing places!"


  STEP 5 — CLOSING

  Celebrate first, then: "You noticed your dinosaur''s amazing Form — those big teeth, that strong tail! And you figured out
  Causation — WHY it needs those features in different places. Big teeth for the jungle, strong legs for the mountain!"

  '
